<!DOCTYPE html>
<html lang="es">
<head><link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Digital Enero-Junio 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ffffff;
            --accent: #ffffff;
            --gold: #ffd700;
            --dark: #0a0a0a;
            --glass: rgba(10, 10, 10, 0.85);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #000;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        /* Fondos por mes */
        .month-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            opacity: 0;
            transition: opacity 1s ease;
            z-index: -1;
        }

        .month-bg.active {
            opacity: 1;
        }

        .month-bg::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,0.8) 100%);
        }

        /* Header Lock In style */
        .header {
            background: linear-gradient(180deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 100%);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #fff, #a0a0a0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Día actual */
        .today-box {
            background: var(--glass);
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 25px;
            margin: 25px auto;
            max-width: 500px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 40px rgba(255,255,255,0.2);
        }

        .today-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--accent);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .today-date {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
        }

        /* Stats */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .stat-item {
            background: var(--glass);
            padding: 15px 25px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }

        .stat-item:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(255,255,255,0.1);
        }

        .xp-bar-container {
            width: 200px;
            height: 24px;
            background: rgba(0,0,0,0.5);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .xp-bar {
            height: 100%;
            background: linear-gradient(90deg, #8338ec, #ffffff);
            transition: width 0.6s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: #fff;
        }

        /* Navegación meses */
        .month-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 25px;
            flex-wrap: wrap;
            background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.5) 100%);
        }

        .month-btn {
            background: var(--glass);
            border: 1px solid var(--border);
            color: #888;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            backdrop-filter: blur(10px);
        }

        .month-btn:hover, .month-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255,255,255,0.4);
        }

        /* Vista de día individual */
        .day-view {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 200;
            overflow-y: auto;
            backdrop-filter: blur(20px);
        }

        .day-view.active {
            display: flex;
            flex-direction: column;
        }

        .day-view-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 30px;
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%);
            position: relative;
        }

        .nav-arrow {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--glass);
            border: 2px solid var(--border);
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .nav-arrow:hover {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            transform: scale(1.1);
        }

        .day-view-content {
            flex: 1;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            width: 100%;
        }

        .day-view-date {
            text-align: center;
            margin-bottom: 40px;
        }

        .day-view-date h2 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .day-view-date .category {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--glass);
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid var(--border);
        }

        .flag-icon {
            font-size: 1.5rem;
        }

        .day-view-fact {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            font-size: 1.3rem;
            line-height: 1.8;
            text-align: center;
            backdrop-filter: blur(20px);
            border-left: 4px solid var(--accent);
        }

        .day-view-tasks {
            background: var(--glass);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid var(--border);
        }

        .day-view-tasks h3 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent);
        }

        .close-day-view {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--glass);
            border: 2px solid var(--border);
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 10;
        }

        .close-day-view:hover {
            background: #ff006e;
            border-color: #ff006e;
            transform: rotate(90deg);
        }

        /* Calendario grid */
        .calendar-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .month-section {
            display: none;
        }

        .month-section.active {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .month-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 30px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 5px;
            background: linear-gradient(90deg, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .day-card {
            background: var(--glass);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
        }

        .day-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .day-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 20px 40px rgba(255,255,255,0.1);
        }

        .day-card:hover::before {
            opacity: 1;
        }

        .day-card.future {
            opacity: 0.6;
        }

        .day-card.future::after {
            content: '🔒';
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.2rem;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }

        .day-number {
            font-size: 1.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .today-badge {
            background: var(--accent);
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .day-date {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .category-tag {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border);
        }

        .fact-preview {
            font-style: italic;
            color: #aaa;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .click-hint {
            text-align: center;
            margin-top: 15px;
            font-size: 0.75rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .day-card:hover .click-hint {
            opacity: 1;
        }

        /* Tareas */
        .task-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            margin: 10px 0;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }

        .task-item:hover {
            border-color: var(--accent);
            background: rgba(255,255,255,0.05);
        }

        .task-item.completed {
            opacity: 0.4;
            text-decoration: line-through;
        }

        .task-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #555;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .task-item.completed .task-checkbox {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }

        /* XP Gain - AHORA BLANCO */
        .xp-gain {
            position: fixed;
            background: linear-gradient(90deg, #ffffff, #cccccc);
            color: #000;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: 700;
            pointer-events: none;
            animation: floatUp 1.5s ease-out forwards;
            z-index: 300;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 10px 30px rgba(255,255,255,0.4);
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.2); }
        }

        /* Modal rango */
        .rank-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 400;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(20px);
        }

        .rank-modal.show {
            display: flex;
        }

        .rank-content {
            background: var(--glass);
            padding: 60px;
            border-radius: 30px;
            text-align: center;
            border: 2px solid var(--accent);
            max-width: 500px;
            box-shadow: 0 0 60px rgba(255,255,255,0.3);
            animation: scaleIn 0.5s;
        }

        @keyframes scaleIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .rank-emoji {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .rank-content h2 {
            font-size: 2rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .rank-content p {
            color: #888;
            font-size: 1.2rem;
        }

        .close-modal {
            margin-top: 30px;
            padding: 15px 40px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
        }

        .close-modal:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255,255,255,0.5);
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 1.8rem; }
            .day-view-date h2 { font-size: 2rem; }
            .nav-arrow { width: 50px; height: 50px; }
            .days-grid { grid-template-columns: 1fr; }
            
            .day-view-header {
                padding: 20px;
                padding-top: 80px;
            }
            
            .close-day-view {
                top: 20px;
                right: 20px;
            }
            
            .nav-arrow:first-child {
                margin-right: auto;
            }
            
            .nav-arrow:last-child {
                margin-left: auto;
            }
        }
    </style>
</head>

        // Comparar fechas
        function isSameDate(date1, date2) {
            return date1.getFullYear() === date2.getFullYear() &&
                   date1.getMonth() === date2.getMonth() &&
                   date1.getDate() === date2.getDate();
        }

        // Verificar si es futuro
        function isFutureDate(date) {
            const d1 = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            const d2 = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate());
            return d1 > d2;
        }

        // Generar tareas
        function getDailyTasks(dayId) {
            const tasks = [];
            const shuffled = [...disciplineTasks].sort(() => 0.5 - Math.random());
            for (let i = 0; i < 4; i++) {
                tasks.push({
                    id: `${dayId}-${i}`,
                    text: shuffled[i]
                });
            }
            return tasks;
        }

        // Completar tarea
        function completeTask(taskId, element) {
            if (gameState.completedTasks.has(taskId)) {
                gameState.completedTasks.delete(taskId);
                gameState.xp = Math.max(0, gameState.xp - 25);
                element.classList.remove('completed');
            } else {
                gameState.completedTasks.add(taskId);
                gameState.xp += 25;
                
                if (gameState.xp >= gameState.level * 100) {
                    gameState.level++;
                    showXPGain(element, '¡Subiste de rango! 🎉');
                } else {
                    showXPGain(element, '+25 XP');
                }
                
                element.classList.add('completed');
                checkRankUp();
            }
            saveGameState();
            updateStats();
        }

            xpGain.textContent = text;
            xpGain.style.left = `${rect.left + rect.width/2}px`;
            xpGain.style.top = `${rect.top}px`;
            document.body.appendChild(xpGain);
            setTimeout(() => xpGain.remove(), 1500);
        }

            const isToday = isSameDate(currentDate, TODAY);
            const isFuture = isFutureDate(currentDate);
            const dayId = `2026-${monthIndex}-${dayIndex}`;
            
            const dateStr = currentDate.toLocaleDateString('es-ES', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            
            const flag = FLAGS[dayData.type];
            const categoryName = dayData.type === 'ecuador' ? 'Ecuador' : 
                                dayData.type === 'europa' ? 'Europa' : 'USA';
            
            let tasksHTML = '';
            if (!isFuture) {
                const tasks = getDailyTasks(dayId);
                tasksHTML = `
                    <div class="day-view-tasks">
                        <h3>Misiones del Día</h3>
                        ${tasks.map(task => `
                            <div class="task-item ${gameState.completedTasks.has(task.id) ? 'completed' : ''}" 
                                 onclick="completeTask('${task.id}', this)">
                                <div class="task-checkbox">
                                    ${gameState.completedTasks.has(task.id) ? '✓' : ''}
                                </div>
                                <span>${task.text}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                tasksHTML = `
                    <div class="day-view-tasks" style="text-align: center; padding: 40px;">
                        <div style="font-size: 3rem; margin-bottom: 20px;">🔒</div>
                        <h3>Misiones Bloqueadas</h3>
                        <p style="color: #888; margin-top: 15px;">Las misiones se desbloquearán el ${dateStr}</p>
                    </div>
                `;
            }
            
            const todayLabel = isToday ? '<div style="color: #ffffff; font-size: 1rem; margin-top: 10px;">⭐ HOY ⭐</div>' : '';
            
            document.getElementById('dayViewContent').innerHTML = `
                <div class="day-view-date">
                    <h2>${dateStr}</h2>
                    ${todayLabel}
                    <div class="category" style="margin-top: 20px;">
                        <span class="flag-icon">${flag}</span>
                        ${categoryName}
                    </div>
                </div>
                <div class="day-view-fact">
                    ${dayData.fact}
                </div>
                ${tasksHTML}
            `;
            
            document.getElementById('dayView').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // CERRAR VISTA DE DÍA
        function closeDayView() {
            document.getElementById('dayView').classList.remove('active');
            document.body.style.overflow = '';
            currentViewDate = null;
        }

        // NAVEGAR ENTRE DÍAS (flechas)
        function navigateDay(direction) {
            if (!currentViewDate) return;
            
            let { month, day } = currentViewDate;
            let newMonth = month;
            let newDay = day + direction;
            
            // Verificar límites del mes
            const daysInMonth = factsData[month].length;
            
            if (newDay < 0) {
                // Ir al mes anterior
                newMonth = month - 1;
                if (newMonth < 0) {
                    closeDayView();
                    return;
                }
                newDay = factsData[newMonth].length - 1;
            } else if (newDay >= daysInMonth) {
                // Ir al mes siguiente
                newMonth = month + 1;
                if (newMonth > 5) {
                    closeDayView();
                    return;
                }
                newDay = 0;
            }
            
            openDayView(newMonth, newDay);
        }

        // Crear tarjeta de día (vista de calendario)
        function createDayCard(day, monthIndex, dayIndex) {
            const card = document.createElement('div');
            const currentDate = new Date(2026, monthIndex, dayIndex + 1);
            const isToday = isSameDate(currentDate, TODAY);
            const isFuture = isFutureDate(currentDate);
            
            card.className = `day-card ${day.type} ${isFuture ? 'future' : ''}`;
            card.onclick = () => openDayView(monthIndex, dayIndex);
            
            const flag = FLAGS[day.type];
            const dateStr = currentDate.toLocaleDateString('es-ES', {
                weekday: 'short',
                month: 'short',
                day: 'numeric'
            });
            
            const todayBadge = isToday ? '<span class="today-badge">Hoy</span>' : '';
            
            card.innerHTML = `
                <div class="day-header">
                    <div>
                        <div class="day-number">${dayIndex + 1} ${todayBadge}</div>
                        <div class="day-date">${dateStr}</div>
                    </div>
                    <span class="category-tag">
                        <span class="flag-icon">${flag}</span>
                    </span>
                </div>
                <div class="fact-preview">
                    ${day.fact}
                </div>
                <div class="click-hint">Click para ver más</div>
            `;
            
            return card;
        }

        // Cambiar fondo según mes
        function changeBackground(monthIndex) {
            document.querySelectorAll('.month-bg').forEach((bg, idx) => {
                bg.classList.toggle('active', idx === monthIndex);
            });
        }

        // Mostrar mes
        function showMonth(monthIndex) {
            changeBackground(monthIndex);
            
            document.querySelectorAll('.month-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === monthIndex);
            });
            
            document.querySelectorAll('.month-section').forEach(section => {
                section.classList.remove('active');
            });
            
            document.getElementById(`month-${monthIndex}`).classList.add('active');
        }

        // Inicializar calendario
        function initCalendar() {
            const container = document.getElementById('calendar');
            const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio'];
            
            monthNames.forEach((monthName, monthIndex) => {
                const monthSection = document.createElement('div');
                monthSection.id = `month-${monthIndex}`;
                monthSection.className = 'month-section';
                
                if (monthIndex === TODAY.getMonth()) {
                    monthSection.classList.add('active');
                    changeBackground(monthIndex);
                }
                
                monthSection.innerHTML = `<h2 class="month-title">${monthName} 2026</h2>`;
                
                const daysGrid = document.createElement('div');
                daysGrid.className = 'days-grid';
                
                factsData[monthIndex].forEach((day, dayIndex) => {
                    daysGrid.appendChild(createDayCard(day, monthIndex, dayIndex));
                });
                
                monthSection.appendChild(daysGrid);
                container.appendChild(monthSection);
            });
        }

        // Iniciar
        window.onload = function() {
            loadGameState();
            initCalendar();
        };

        // Cerrar con tecla ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeDayView();
            if (e.key === 'ArrowLeft' && currentViewDate) navigateDay(-1);
            if (e.key === 'ArrowRight' && currentViewDate) navigateDay(1);
        });
    </script>
</body>
</html>
